name: ios-ipa

# iOS 技术验证包：只编译「未签名 ipa」，签名与安装交给 Windows 上的
# AltStore / Sideloadly（免费 Apple ID，7 天续签）
# 目标机 iPadOS 17.7.11 > 16.6.1，TrollStore 不可用
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Kotlin/Native 编译 iOS 真机（arm64）的静态 framework
      - name: Build Kotlin framework
        run: gradle -p ios :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Stage framework
        run: |
          mkdir -p ios/iosApp/Frameworks
          cp -R ios/composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework ios/iosApp/Frameworks/

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios/iosApp && xcodegen generate

      # 播放内核 MobileVLCKit 走 CocoaPods；先有 .xcodeproj 才能 pod install
      - name: Install CocoaPods dependencies
        run: |
          cd ios/iosApp
          pod install --repo-update

      - name: Build app (unsigned)
        run: |
          cd ios/iosApp
          xcodebuild -workspace DavPlayerIos.xcworkspace \
            -scheme DavPlayerIos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/iosApp/build/Build/Products/Release-iphoneos/DavPlayer.app out/Payload/
          cd out && zip -qry DavPlayer-unsigned.ipa Payload
          ls -lh DavPlayer-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: out/DavPlayer-unsigned.ipa
